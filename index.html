<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karty</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div class="cards__wrapper">
        <figure  class="card">
            <header class="card__header">
                <div class="badges">
                    <span class="badge__variant badge">9 variant</span>
                    <span class="badge__warranty badge">Záruka 24 měsíců</span>
                    <div class="badge__img"><img src="imgs/energy-label-a.svg" alt=""></div>
                </div>
                    <div class="card__image-wrapper">
                        <a href="#">
                            <img src="imgs/apple-iphone-17-pro-max-512gb-stribrna_ig563025.webp" alt="Apple Iphone 17 Pro Max" class="image">
                        </a>
                    </div>
            </header>
            <h2 class="card__title">
                <a href="#">Apple iPhone 17 Pro Max 512GB stříbrná</a>
            </h2>
            <div class="card__description-wrapper">
                <p class="card__description">Smartphone - 6,9" Super Retina XDR OLED 2868x1320 (120Hz), operační paměť 12 GB, vnitřní paměť 512
                    GB, single SIM + eSIM, procesor Apple A19 Pro, fotoaparát: 48Mpx hlavní + 48Mpx širokoúhlý + 12Mpx
                    teleobjektiv, přední kamera 18Mpx, NFC, GPS, LTE, 5G</p>
            </div>
            <div class="card__price">
                <span class="card__price-DPH">40&nbsp;990&nbsp;Kč</span>
                <span>33&nbsp;876&nbsp;Kč bez DPH</span>
            </div>
            <div class="card__button">
                <a href="#">Přidat do&nbsp;košíku</a>
            </div>
            <div class="card__available">
                <span>Skladem 5 ks</span>
                <span>Doručíme Zítra</span>
            </div>
            <footer class="card__footer">
                <div class="card__footer-delivery_info">
                    <div class="card__footer-icon_truck"></div>
                    <p>Dnes objednej do 21:00 a zítra si zboží užívej</p>
                    <div class="card__footer-icon_info"></div>
                </div>
            </footer>
        </figure>
    </div>
</body>

</html>
